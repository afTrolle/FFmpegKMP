<!doctype html>

<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FFmpegKMP Wasm worker smoke test</title>
</head>
<body>
  <h1>FFmpegKMP Wasm worker smoke test</h1>
  <p id="status">starting</p>
  <p>UI heartbeat: <span id="heartbeat">0</span></p>
  <pre id="events"></pre>
  <script type="module">
    const status = document.querySelector('#status');
    const heartbeatNode = document.querySelector('#heartbeat');
    const eventsNode = document.querySelector('#events');
    const decoder = new TextDecoder();
    let heartbeat = 0;
    const timer = setInterval(() => {
      heartbeat += 1;
      heartbeatNode.textContent = String(heartbeat);
    }, 10);

    const worker = new Worker(
      '/bindings/src/wasmJsMain/resources/ffmpegkmp-worker.mjs',
      { type: 'module' },
    );
    const width = 256;
    const height = 256;
    const header = new TextEncoder().encode(`P6\n${width} ${height}\n255\n`);
    const ppm = new Uint8Array(header.length + width * height * 3);
    ppm.set(header);
    for (let index = header.length; index < ppm.length; index += 3) {
      ppm[index] = (index / 3) % width;
      ppm[index + 1] = Math.floor((index / 3) / width);
      ppm[index + 2] = 127;
    }
    const startedAt = heartbeat;
    worker.onmessage = ({ data }) => {
      if (data.type === 'event') {
        eventsNode.textContent += decoder.decode(data.bytes);
        return;
      }
      if (data.type === 'complete') {
        const responsive = heartbeat - startedAt >= 2;
        status.textContent = data.returnCode === 0 && responsive
          ? 'PASS: command completed and the UI heartbeat remained responsive'
          : `FAIL: returnCode=${data.returnCode}, heartbeatDelta=${heartbeat - startedAt}`;
      } else if (data.type === 'failure') {
        status.textContent = `FAIL: ${data.message}`;
      }
      clearInterval(timer);
      worker.terminate();
    };
    worker.onerror = event => {
      status.textContent = `FAIL: ${event.message}`;
      clearInterval(timer);
      worker.terminate();
    };
    worker.postMessage({
      type: 'execute',
      id: 'browser-smoke',
      kind: 'ffmpeg',
      arguments: [
        '-hide_banner', '-loglevel', 'error',
        '-threads', '1', '-filter_threads', '1',
        '-loop', '1', '-framerate', '30', '-i', '/input.ppm',
        '-frames:v', '30', '-vf', 'scale=1280:720', '-f', 'null', '-',
      ],
      inputs: [{ path: '/input.ppm', bytes: ppm }],
      outputPaths: [],
      moduleUrl: '/native-build/wasm/build/worker/standard/ffmpegkmp.mjs',
    });
  </script>
</body>
</html>
